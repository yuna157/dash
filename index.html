<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>처음 만나는 Gemini Spark</title>
  <style>body{font-family:Arial,"Malgun Gothic",sans-serif;margin:0;padding:32px;color:#222}#status{max-width:760px;margin:12vh auto;text-align:center;line-height:1.7}.spin{width:28px;height:28px;margin:0 auto 18px;border:3px solid #ddd;border-top-color:#6b5bd2;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div id="status"><div class="spin"></div>페이지를 불러오는 중입니다…</div>
  <script>
  (async()=>{
    const files=['00','01','02','03','04','05'];
    const parts=await Promise.all(files.map(async n=>{
      const r=await fetch(`data/chunk_${n}.txt?v=2`,{cache:'no-store'});
      if(!r.ok) throw new Error(`데이터 조각 ${n} 로드 실패 (${r.status})`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    if(!/^[A-Za-z0-9+/]+={0,2}$/.test(b64) || b64.length%4!==0) throw new Error('배포 데이터가 손상되었습니다.');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    document.open();document.write(html);document.close();
  })().catch(e=>{
    document.getElementById('status').innerHTML=`<h2>페이지를 불러오지 못했습니다.</h2><p>${String(e)}</p><p>잠시 후 새로고침해 주세요.</p>`;
  });
  </script>
</body>
</html>
